# Evolution API — wpp.cardosomatheus.com.br
# Reverse proxy para Evolution API rodando em Docker (porta 8080)
# SSL será configurado automaticamente pelo Certbot

# Rate limiting
limit_req_zone $binary_remote_addr zone=evolution_api:10m rate=20r/s;

server {
    listen 80;
    server_name wpp.cardosomatheus.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wpp.cardosomatheus.com.br;

    # SSL — Certbot vai preencher automaticamente, mas deixamos o path esperado
    ssl_certificate /etc/letsencrypt/live/wpp.cardosomatheus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpp.cardosomatheus.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # IP whitelist da HostGator (descomente e ajuste se souber o IP fixo)
    # allow IP_HOSTGATOR;
    # allow SEU_IP_ADMIN;
    # deny all;

    location / {
        limit_req zone=evolution_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (necessário para QR code e eventos)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Tamanho máximo de upload (para envio de mídia via WhatsApp)
        client_max_body_size 50M;
    }
}
