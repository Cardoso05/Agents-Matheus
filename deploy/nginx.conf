# Nginx config para Cérebro + FinBot
# Instalar: sudo cp deploy/nginx.conf /etc/nginx/sites-available/cerebro
#           sudo ln -sf /etc/nginx/sites-available/cerebro /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

# Rate limiting (deve ficar fora do bloco server)
limit_req_zone $binary_remote_addr zone=cerebro_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cerebro_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=finbot_web:10m rate=30r/s;

# ── Cérebro Dashboard (porta 8000) ────────────────────────
server {
    listen 80;
    server_name _;

    # ── Basic Auth ──────────────────────────────────────────
    auth_basic "Cerebro - Acesso Restrito";
    auth_basic_user_file /etc/nginx/.htpasswd_cerebro;

    # ── Security Headers ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' cdn.jsdelivr.net 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' *.supabase.co" always;

    # ── Cérebro Dashboard ───────────────────────────────────
    location / {
        limit_req zone=cerebro_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        limit_req zone=cerebro_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── FinBot Dashboard (porta 3000) ───────────────────────
    location /finbot/ {
        limit_req zone=finbot_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # WebSocket support (Next.js HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # FinBot static assets (_next)
    location /_next/ {
        proxy_pass http://127.0.0.1:3000/_next/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. { deny all; }
    location ~ \.env { deny all; }
    location ~ \.db { deny all; }
}

