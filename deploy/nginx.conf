# Nginx config para Cérebro + FinBot
# Domínio: cerebro.cardosomatheus.com.br
# SSL: Let's Encrypt (certbot)

# Rate limiting
limit_req_zone $binary_remote_addr zone=cerebro_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cerebro_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=finbot_web:10m rate=30r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────
server {
    listen 80;
    server_name cerebro.cardosomatheus.com.br;
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name cerebro.cardosomatheus.com.br;

    ssl_certificate /etc/letsencrypt/live/cerebro.cardosomatheus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cerebro.cardosomatheus.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Basic Auth ──────────────────────────────────────────
    auth_basic "Cerebro - Acesso Restrito";
    auth_basic_user_file /etc/nginx/.htpasswd_cerebro;

    # ── Security Headers ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' cdn.jsdelivr.net 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' *.supabase.co" always;

    # ── Cérebro Dashboard (porta 8000) ──────────────────────
    location / {
        limit_req zone=cerebro_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        limit_req zone=cerebro_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── FinBot Dashboard (porta 3000) ───────────────────────
    location /finbot/ {
        limit_req zone=finbot_web burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/ {
        proxy_pass http://127.0.0.1:3000/_next/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. { deny all; }
    location ~ \.env { deny all; }
    location ~ \.db { deny all; }
}
